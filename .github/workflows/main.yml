            skippedWeeks: {},
            exercises: [
              { id: "d1_1", code: "", group: "", zone: "Плечи", name: "1. Армейский жим в Смите (или жим гантелей сидя)", muscle: "Плечи", rest: "3 мин", weeks: makeEmptyWeeks(3, "6–8", 7) },
              { id: "d1_2", code: "", group: "", zone: "Средняя дельта", name: "2. Махи гантелями стоя / сидя (средняя дельта)", muscle: "Средняя дельта", rest: "90 сек", weeks: makeEmptyWeeks(3, "10–12", 8) },
              { id: "d1_3", code: "", group: "", zone: "Плечи", name: "3. Жим в Хаммере на плечи (параллельный хват)", muscle: "Плечи", rest: "2.5 мин", weeks: makeEmptyWeeks(3, "8–10", 7) },
              { id: "d1_4", code: "", group: "", zone: "Средняя дельта", name: "4. Отведения руки в сторону на нижнем блоке", muscle: "Средняя дельта", rest: "60 сек", weeks: makeEmptyWeeks(3, "12–15", 8) },
              { id: "d1_5", code: "", group: "", zone: "Задняя дельта", name: "5. Обратные разведения в Pec Deck (задняя дельта)", muscle: "Задняя дельта", rest: "90 сек", weeks: makeEmptyWeeks(4, "12–15", 8) },
              { id: "d1_6", code: "", group: "", zone: "Задняя дельта", name: "6. Тяга каната к лицу (Face Pull)", muscle: "Задняя дельта", rest: "90 сек", weeks: makeEmptyWeeks(3, "12–15", 8) },
              { id: "d1_7", code: "", group: "", zone: "Трапеция", name: "7. Шраги с гантелями или в Смите", muscle: "Трапеция", rest: "90 сек", weeks: makeEmptyWeeks(3, "10–12", 8) }
            ]
          },
          2: {
            title: "Среда — Задняя цепь и Ноги",
            shortTitle: "Среда",
            skippedWeeks: {},
            exercises: [
              { id: "d2_1", code: "", group: "", zone: "База", name: "1. Становая тяга (классика или с плинтов)", muscle: "Спина / Бицепс бедра", rest: "4 мин", weeks: makeEmptyWeeks(3, "5–6", 7) },
              { id: "d2_2", code: "", group: "", zone: "Бицепс бедра", name: "2. Сгибания голени лежа в тренажере", muscle: "Бицепс бедра", rest: "2 мин", weeks: makeEmptyWeeks(3, "8–12", 8) },
              { id: "d2_3", code: "", group: "", zone: "Бицепс бедра", name: "3. Румынская тяга с гантелями (акцент на растяжение)", muscle: "Бицепс бедра", rest: "2.5 мин", weeks: makeEmptyWeeks(3, "8–10", 7) },
              { id: "d2_4", code: "", group: "", zone: "Бицепс бедра", name: "4. Сгибания ног сидя в тренажере", muscle: "Бицепс бедра", rest: "90 сек", weeks: makeEmptyWeeks(3, "12–15", 8) },
              { id: "d2_5", code: "", group: "", zone: "Ягодицы", name: "5. Гиперэкстензия с отягощением (с круглой спиной)", muscle: "Ягодицы", rest: "90 сек", weeks: makeEmptyWeeks(3, "12–15", 8) },
              { id: "d2_6", code: "", group: "", zone: "Икры", name: "6. Подъем на носки стоя в тренажере (икроножная)", muscle: "Икры", rest: "90 сек", weeks: makeEmptyWeeks(3, "10–12", 8) },
