  <script>
    // =========================================================================
    // 1. PARSING HELPERS: STRICT REST TIMER (NO UNNEEDED TRANSITION!) & SCHEME
    // =========================================================================

    /**
     * Parses rest text from spreadsheet cell (e.g. "3 мин", "90 сек", "2.5 мин", "4 мин", "15-20 сек переход к A2").
     * IMPORTANT RULE FROM USER:
     * If there is NO transition needed (no "переход" in text and not a superset),
     * hasTransition MUST be false so NO "15с переход" button is shown!
     */
    function isValidRestTimeString(str) {
      const s = String(str || "").toLowerCase().trim();
      if (!s || s === "—" || s === "-") return false;
      if (/rpe\s*\d/i.test(s) || /^\d+\s*[xхXХ*×]/i.test(s)) return false;
      return /\d+(?:[.,]\d+)?\s*(?:[-–—]\s*\d+(?:[.,]\d+)?)?\s*(?:мин|сек|min|sec|с\b|м\b)/i.test(s) || /^\d{2,3}$/.test(s);
    }

    function parseRestTimersFromText(restText, isSuperset) {
      let raw = String(restText || "").trim();
      if (!isValidRestTimeString(raw)) {
        raw = "90 сек";
      }
      const low = raw.toLowerCase().replace(",", ".");
      let hasTransition = false;
      let transitionSec = 0;
      let restSec = 90;
      let restDisplayLabel = raw;

      const isMinutes = low.includes("мин") || low.includes("min") || /\bм\b/.test(low);
      const numbers = (low.match(/\d+(?:\.\d+)?/g) || []).map(Number).filter(n => !isNaN(n) && n > 0);

      if (low.includes("переход") || isSuperset) {
        hasTransition = true;
        if (low.includes("переход") && numbers.length > 0) {
          transitionSec = Math.round(isMinutes ? numbers[0] * 60 : numbers[0]);
          restSec = 90;
        } else {
          transitionSec = 20;
          restSec = numbers.length > 0 ? Math.round(isMinutes ? numbers[0] * 60 : numbers[0]) : 90;
        }
      } else if (numbers.length > 0) {
        // Pure rest time (e.g. "3 мин" -> 180s, "2.5 мин" -> 150s, "90 сек" -> 90s, "60-90 сек" -> 90s)
        hasTransition = false;
        const val = numbers[numbers.length - 1];
        restSec = Math.round(isMinutes ? val * 60 : val);
      }

      return {
        hasTransition,
        transitionSec,
        restSec,
        restDisplayLabel: `${restSec}с (${raw})`
      };
    }

    /**
     * Parses scheme cell and combines it properly with the dedicated "Повторы" column!
     * Fixes the bug where "3 x" in Week column + "6-8" in Reps column produced "3 × 3 x".
     * Now "3 x" + fallbackReps "6-8" cleanly produces sets=3, reps="6-8", scheme="3×6-8"!
     */
    function parseSchemeAndRpeCell(cellText, colRepsValue) {
      const str = String(cellText || "").trim();
      const cleanColReps = String(colRepsValue || "").trim();

      let rpe = null;
      const rpeMatch = str.match(/RPE\s*(\d+(?:[.,]\d+)?)/i);
      if (rpeMatch) {
        rpe = Math.round(Number(rpeMatch[1].replace(",", ".")));
      }

      // Extract intensification suffix if present (e.g. "+ Одинарный дроп-сет", "+ Отдых-пауза (1 кластер)", "+ Двойной дроп + Частичные", "+ Мио-повторения")
      let intensification = "";
      let mainPart = str;

      // Pattern A: Anything after "RPE <num> +" or after first "+" following sets/RPE
      const afterRpePlus = str.match(/RPE\s*\d+(?:[.,]\d+)?\s*\)?\s*\+\s*(.+)$/i);
      if (afterRpePlus && afterRpePlus[1]) {
        intensification = afterRpePlus[1].trim();
        mainPart = str.slice(0, afterRpePlus.index + afterRpePlus[0].indexOf("+")).trim();
      } else {
        // Pattern B: "+ <intensifier keyword>" anywhere in the cell
        const plusSplit = str.match(/^([^+]+?)\s*\+\s*(.*(?:дроп|кластер|отдых[- ]пауз|частичн|мио|негатив|пауз|стрип|отказ|форсир).*)$/i);
        if (plusSplit) {
          mainPart = plusSplit[1].trim();
          intensification = plusSplit[2].trim();
        }
      }

      // Remove "(RPE ...)" or "RPE ..." from mainPart
      const withoutRpe = mainPart
        .replace(/\(?\s*RPE\s*\d+(?:[.,]\d+)?\s*\)?/gi, "")
        .replace(/[,;|/+]+$/, "")
        .trim();

      let sets = 3;
      let reps = (cleanColReps && cleanColReps !== "—" && cleanColReps !== "-") ? cleanColReps : "8–12";

      // Case 1: Full "3х8-10" or "4x12" inside the week cell (where second part starts with digits and is NOT RPE)
      const fullMultMatch = withoutRpe.match(/^(\d+)\s*[xхXХ*×]\s*(\d+(?:\s*[-–—]\s*\d+)?)$/);
      if (fullMultMatch) {
        sets = parseInt(fullMultMatch[1], 10) || 3;
        reps = fullMultMatch[2].trim();
      } else {
        // Case 2: Week cell has "4 × RPE 9" -> withoutRpe is "4 ×" or "4", while reps are in the "Повторы" column!
        const firstDigit = withoutRpe.match(/^(\d+)/);
        if (firstDigit) {
          sets = parseInt(firstDigit[1], 10) || 3;
        }
      }

      return {
        sets,
        reps,
        scheme: `${sets}×${reps}`,
        rpe: rpe !== null ? rpe : 8,
        intensification
      };
    }

    // =========================================================================
    // 2. INITIAL PROGRAM (Matches User's 5-Day Split Screenshot with Empty Weights)
    // =========================================================================
    function createInitial5DaySplitClient() {
      // Built directly from the user's screenshot 3 (Понедельник, Среда, Четверг, Пятница, Суббота; Вторник/Воскресенье skipped as rest days; NO pre-filled weights!)
      const makeEmptyWeeks = (setsCount, repsRange, planRpe = 8) => {
        const weeks = {};
        const rpeProg = { 1: planRpe, 2: 8, 3: 8, 4: 9, 5: 9, 6: 6 };
        for (let w = 1; w <= 6; w++) {
          const s = w === 6 ? 2 : setsCount;
          const r = rpeProg[w] || planRpe;
          weeks[w] = {
            planSets: s,
            planReps: repsRange,
            planScheme: `${s}×${repsRange}`,
            planRpe: r,
            weight: "", // Strictly empty unless specified in table!
            actualSets: s,
            actualReps: repsRange,
            actualRpe: r,
            status: "pending",
            skipReason: ""
          };
        }
        return weeks;
      };

      return {
        id: "client_split_default",
        name: "План 5 дней (ПН–СБ)",
        subtitle: "Сводная: Недели 1–6 (без старых весов)",
        totalWeeks: 6,
        pinned: true,
        activeWeek: 1,
        activeDay: 1,
        allowedRpeValues: [6, 7, 8, 9, 10],
        days: {
          1: {
            title: "Понедельник — Плечи и Верх",
